<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nasdaq Top 10</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Nasdaq Top 10</h1>
      <p class="sub">Largest Nasdaq-listed companies by market cap</p>
    </div>
    <nav id="ranges" role="tablist" aria-label="Time range">
      <button data-range="1M" class="active">1M</button>
      <button data-range="3M">3M</button>
      <button data-range="YTD">YTD</button>
      <button data-range="1Y">1Y</button>
      <button data-range="3Y">3Y</button>
      <button data-range="5Y">5Y</button>
    </nav>
  </header>

  <div id="notice" class="notice" hidden></div>

  <main>
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 id="chart-title">Performance comparison</h2>
          <p id="chart-sub" class="sub">% change over the selected period</p>
        </div>
        <button id="compare-btn" class="ghost" hidden>← Compare all</button>
      </div>
      <div class="chart-wrap"><canvas id="main-chart"></canvas></div>
    </section>

    <section>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <footer>Data: Nasdaq screener &amp; Yahoo Finance. Prices may be delayed. Not investment advice.</footer>

  <script src="app.js"></script>
</body>
</html>
